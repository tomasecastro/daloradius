# daloRADIUS Docker Compose orchestrator
#
# Standalone service files live in docker/<service>/docker-compose.yml.
# This file includes all three via the `include:` directive.
#
# This file is STATIC and versioned on purpose: it contains no secrets, no
# host paths and no environment values, so there is nothing deployment-specific
# to generate. setup/install-docker-compose.sh validates it instead of
# overwriting it.
#
# Optional variants (e.g. MariaDB TLS) belong in docker-compose.override.yml,
# which Docker Compose loads automatically.
#
# Usage:
#   docker compose up -d --build

include:
  - docker/mariadb/docker-compose.yml
  - docker/freeradius/docker-compose.yml
  - docker/daloradius/docker-compose.yml

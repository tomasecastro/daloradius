# Log rotation policy for the modular FreeRADIUS container.
#
# Mounted read-only at /etc/logrotate.d/freeradius by
# docker/freeradius/docker-compose.yml. The entrypoint starts a background
# runner (docker/freeradius/logrotate-loop.sh) because containers have no cron
# daemon. See Documentacion/daloradius/specs/014-logs-rotatorios-modulares/.
#
# Policy: weekly rotation, 12 kept files (~3 months), compressed.

/var/log/freeradius/radius.log {
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    create 0640 freerad freerad
    # The entrypoint records the foreground FreeRADIUS PID so rotation can ask
    # it to reopen its log file instead of continuing to write to the rotated
    # one.
    postrotate
        if [ -s /var/run/radiusd.pid ]; then
            kill -HUP "$(cat /var/run/radiusd.pid)" 2>/dev/null || true
        fi
    endscript
}

# Detail accounting files: FreeRADIUS writes
# /var/log/freeradius/radacct/<client>/detail-YYYYMMDD. They are opened per
# record, so no reopen signal is needed after rotation.
/var/log/freeradius/radacct/*/detail-* {
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    create 0640 freerad freerad
}

# Maintenance logs written by the background runners (Specs 012 and 014).
# They share the same volume as radius.log but are opened in append mode by
# long-lived shells that never reopen them, so the reopen signal used above
# would not help: copytruncate copies the content and truncates the original
# in place. Growth is slow (one line per run), but an unbounded log on the
# volume that exists to avoid filling the disk makes no sense.
/var/log/freeradius/logrotate.log
/var/log/freeradius/session-cleanup.log
/var/log/freeradius/session-cleanup-runner.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

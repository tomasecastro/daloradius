/var/log/freeradius/radius.log {
    weekly
    rotate 12    # Aprox. 3 meses (menos de 6 meses como solicitado)
    compress
    delaycompress
    missingok
    notifempty
    create 0640 freerad freerad
    postrotate
        /usr/sbin/service freeradius reload > /dev/null 2>&1 || true
    endscript
}

